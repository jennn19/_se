services:
  # ---------------- PostgreSQL 資料庫 ----------------
  db:
    image: postgres:16-alpine
    container_name: docker06-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 不對外開放，只有後端服務能連線（安全性）

  # ---------------- Node.js 微服務 ----------------
  node-api:
    build:
      context: ./services/node-api
      dockerfile: Dockerfile
    container_name: docker06-node
    restart: unless-stopped
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGUSER: appuser
      PGPASSWORD: apppassword
      PGDATABASE: appdb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend

  # ---------------- Rust 微服務 ----------------
  rust-api:
    build:
      context: ./services/rust-api
      dockerfile: Dockerfile
    container_name: docker06-rust
    restart: unless-stopped
    networks:
      - frontend

  # ---------------- Python 微服務 ----------------
  python-api:
    build:
      context: ./services/python-api
      dockerfile: Dockerfile
    container_name: docker06-python
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: appuser
      PGPASSWORD: apppassword
      PGDATABASE: appdb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend

  # ---------------- Nginx 反向代理 + Web 前端 ----------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: docker06-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - node-api
      - rust-api
      - python-api
    networks:
      - frontend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  db-data:
