<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="微光筆記：一個簡潔、優雅的線上筆記工具。"
    />
    <title>微光筆記 · Note App</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="relative min-h-screen overflow-x-hidden bg-gradient-to-br from-slate-50 to-slate-100 font-sans text-slate-800 antialiased"
  >
    <div
      aria-hidden="true"
      class="pointer-events-none absolute inset-0 overflow-hidden"
    >
      <div
        class="absolute -left-24 -top-24 h-72 w-72 rounded-full bg-indigo-200/40 blur-3xl"
      ></div>
      <div
        class="absolute -bottom-32 -right-20 h-80 w-80 rounded-full bg-violet-200/40 blur-3xl"
      ></div>
      <div
        class="absolute left-1/2 top-10 h-40 w-40 -translate-x-1/2 rounded-full bg-sky-100/50 blur-3xl"
      ></div>
    </div>

    <main
      class="relative flex min-h-screen items-center justify-center px-4 py-12 sm:px-6"
    >
      <section
        class="w-full max-w-xl rounded-2xl border border-white/80 bg-white/95 p-6 shadow-xl shadow-slate-300/30 backdrop-blur sm:p-8"
      >
        <header class="flex items-start gap-4">
          <div
            class="flex h-12 w-12 flex-none items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 text-white shadow-lg shadow-indigo-200"
          >
            <svg
              aria-hidden="true"
              class="h-6 w-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M16.862 4.487 19.5 7.125m-7.638-2.638L5.625 10.725a3 3 0 0 0-.82 1.487l-.98 3.92a.75.75 0 0 0 .91.91l3.92-.98a3 3 0 0 0 1.487-.82l6.238-6.238a1.875 1.875 0 1 0-2.651-2.652Z"
              />
            </svg>
          </div>

          <div class="min-w-0">
            <p
              class="text-xs font-semibold uppercase tracking-[0.24em] text-indigo-500"
            >
              Daily Notes
            </p>
            <h1
              class="mt-1 text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl"
            >
              微光筆記
            </h1>
            <p class="mt-2 text-sm leading-6 text-slate-500">
              把腦中的小念頭，好好收進今天。
            </p>
          </div>
        </header>

        <form id="note-form" class="mt-8" novalidate>
          <label
            for="note-input"
            class="mb-2 block text-sm font-semibold text-slate-700"
          >
            新增一則筆記
          </label>

          <div class="flex flex-col gap-3 sm:flex-row">
            <div class="relative flex-1">
              <input
                id="note-input"
                data-testid="note-input"
                name="content"
                type="text"
                maxlength="50"
                autocomplete="off"
                placeholder="例如：下午三點前回覆客戶信件"
                class="w-full rounded-xl border border-slate-200 bg-slate-50/80 px-4 py-3 pr-16 text-[15px] text-slate-800 outline-none transition duration-200 placeholder:text-slate-400 focus:border-indigo-400 focus:bg-white focus:ring-4 focus:ring-indigo-100/80"
              />
              <span
                id="character-count"
                class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-xs font-medium tabular-nums text-slate-400"
              >
                0 / 50
              </span>
            </div>

            <button
              id="note-submit"
              data-testid="note-submit"
              type="submit"
              class="group inline-flex items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-5 py-3 text-sm font-semibold text-white shadow-md shadow-indigo-200 transition duration-200 hover:-translate-y-0.5 hover:from-indigo-500 hover:to-violet-500 hover:shadow-lg hover:shadow-indigo-200/80 focus:outline-none focus-visible:ring-4 focus-visible:ring-indigo-200 disabled:cursor-wait disabled:opacity-60 disabled:hover:translate-y-0"
            >
              <svg
                aria-hidden="true"
                class="h-4 w-4 transition-transform duration-200 group-hover:rotate-90"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2.2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 5v14m7-7H5"
                />
              </svg>
              <span id="submit-label">新增筆記</span>
            </button>
          </div>

          <p
            id="note-error"
            data-testid="note-error"
            role="alert"
            class="mt-2 hidden text-sm font-medium text-rose-500"
          ></p>
        </form>

        <div class="my-7 flex items-center gap-3">
          <div class="h-px flex-1 bg-slate-100"></div>
          <span
            id="note-count"
            class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-400"
          >
            還沒有筆記
          </span>
          <div class="h-px flex-1 bg-slate-100"></div>
        </div>

        <div
          id="empty-state"
          data-testid="empty-state"
          class="flex flex-col items-center justify-center rounded-xl border border-dashed border-slate-200 bg-slate-50/60 px-6 py-10 text-center"
        >
          <div
            class="flex h-11 w-11 items-center justify-center rounded-full bg-white text-slate-300 shadow-sm"
          >
            <svg
              aria-hidden="true"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M8.25 6.75h7.5M8.25 10.5h7.5m-7.5 3.75h4.5M6 3.75h12A1.5 1.5 0 0 1 19.5 5.25v13.5A1.5 1.5 0 0 1 18 20.25H6a1.5 1.5 0 0 1-1.5-1.5V5.25A1.5 1.5 0 0 1 6 3.75Z"
              />
            </svg>
          </div>
          <p class="mt-3 text-sm font-semibold text-slate-500">
            目前無任何筆記
          </p>
          <p class="mt-1 text-xs leading-5 text-slate-400">
            從上方輸入第一個想法，開始記錄今天。
          </p>
        </div>

        <ul
          id="note-list"
          data-testid="note-list"
          class="space-y-3"
          aria-live="polite"
        ></ul>

        <footer class="mt-8 border-t border-slate-100 pt-4">
          <p class="text-center text-xs leading-5 text-slate-400">
            資料儲存於記憶體，重新啟動服務後將清空。
          </p>
        </footer>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
